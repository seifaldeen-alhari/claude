<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مهامي</title>
  <style>
    :root { --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#4f46e5; --border:#e5e7eb;
            --low:#10b981; --medium:#f59e0b; --high:#ef4444; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1117; --card:#1a1d27; --text:#e5e7eb; --muted:#9ca3af; --border:#2a2e3b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { margin: 0 0 4px; }
    .stats { color: var(--muted); margin-bottom: 20px; }
    form, .toolbar { display:flex; gap:8px; margin-bottom: 12px; flex-wrap: wrap; }
    input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border:1px solid var(--border);
      background: var(--card); color: var(--text); }
    input[type=text], input[type=search] { flex: 1; min-width: 160px; }
    button { cursor:pointer; }
    button.primary { background: var(--accent); color:#fff; border-color: var(--accent); }
    .filters button.active { background: var(--accent); color:#fff; border-color: var(--accent); }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border);
      border-radius:10px; padding:12px; margin-bottom:8px; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    .title { flex:1; word-break: break-word; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; color:#fff; }
    .badge.low { background: var(--low); } .badge.medium { background: var(--medium); } .badge.high { background: var(--high); }
    .del { border:none; background:none; color: var(--muted); font-size: 18px; padding: 4px 8px; }
    .del:hover { color: var(--high); }
    .empty { text-align:center; color:var(--muted); padding: 30px 0; }
    .error { color: var(--high); min-height: 1.2em; }
  </style>
</head>
<body>
<main>
  <h1>📝 مهامي</h1>
  <div class="stats" id="stats"></div>

  <form id="add">
    <input type="text" id="title" placeholder="ماذا تريد أن تنجز؟" maxlength="200" required>
    <select id="priority">
      <option value="low">منخفضة</option>
      <option value="medium" selected>متوسطة</option>
      <option value="high">عالية</option>
    </select>
    <button class="primary">إضافة</button>
  </form>
  <div class="error" id="error"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="بحث...">
    <div class="filters">
      <button data-status="" class="active">الكل</button>
      <button data-status="open">قيد التنفيذ</button>
      <button data-status="done">منجزة</button>
    </div>
  </div>

  <ul id="list"></ul>
</main>

<script>
  const PRIORITY_LABEL = { low: 'منخفضة', medium: 'متوسطة', high: 'عالية' };
  const state = { status: '', q: '' };
  const $ = (id) => document.getElementById(id);

  async function api(path, options = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    return data;
  }

  async function refresh() {
    const params = new URLSearchParams();
    if (state.status) params.set('status', state.status);
    if (state.q) params.set('q', state.q);
    const [tasks, stats] = await Promise.all([api('/api/tasks?' + params), api('/api/stats')]);
    $('stats').textContent = `${stats.total} مهمة · ${stats.done} منجزة · ${stats.open} متبقية`;
    const list = $('list');
    list.innerHTML = '';
    if (!tasks.length) {
      list.innerHTML = '<li class="empty">لا توجد مهام هنا بعد ✨</li>';
      return;
    }
    for (const t of tasks) {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}>
        <span class="title"></span>
        <span class="badge ${t.priority}">${PRIORITY_LABEL[t.priority]}</span>
        <button class="del" title="حذف">✕</button>`;
      li.querySelector('.title').textContent = t.title; // textContent لمنع حقن HTML
      li.querySelector('input').onchange = (e) => mutate(`/api/tasks/${t.id}`, 'PATCH', { done: e.target.checked });
      li.querySelector('.del').onclick = () => mutate(`/api/tasks/${t.id}`, 'DELETE');
      list.append(li);
    }
  }

  async function mutate(path, method, body) {
    try {
      $('error').textContent = '';
      await api(path, { method, body: body && JSON.stringify(body) });
      await refresh();
    } catch (err) {
      $('error').textContent = err.message;
    }
  }

  $('add').onsubmit = async (e) => {
    e.preventDefault();
    await mutate('/api/tasks', 'POST', { title: $('title').value, priority: $('priority').value });
    $('title').value = '';
  };

  let timer;
  $('search').oninput = (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value; refresh(); }, 200);
  };

  document.querySelectorAll('.filters button').forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll('.filters button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      state.status = btn.dataset.status;
      refresh();
    };
  });

  refresh();
</script>
</body>
</html>
